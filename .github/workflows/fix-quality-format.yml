name: Apply quality report formatting fix

on:
  push:
    branches:
      - feat/attrition-missingness-reports
    paths:
      - .github/workflows/fix-quality-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attrition-missingness-reports
          fetch-depth: 0

      - name: Split long Markdown strings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/clinical_data_platform/synthea_quality.py")
          text = path.read_text(encoding="utf-8")
          old = '''            "- `required`: a blank value would violate the active contract; verified reports require zero.",
            "- `optional`: absence is permitted and may represent a clinical state such as no recorded death or no end date.",
            "- `structural`: the current adapter does not receive a reliable structured value for the field.",
            "- Source missingness is descriptive and does not assign contract requirements to upstream columns.",
            "- Rates compare synthetic artifacts descriptively; no hypothesis test or clinical inference is performed.",
'''
          new = '''            (
                "- `required`: a blank value would violate the active contract; "
                "verified reports require zero."
            ),
            (
                "- `optional`: absence is permitted and may represent a clinical "
                "state such as no recorded death or no end date."
            ),
            (
                "- `structural`: the current adapter does not receive a reliable "
                "structured value for the field."
            ),
            (
                "- Source missingness is descriptive and does not assign contract "
                "requirements to upstream columns."
            ),
            (
                "- Rates compare synthetic artifacts descriptively; no hypothesis "
                "test or clinical inference is performed."
            ),
'''
          if old not in text:
              raise SystemExit("Expected formatting block was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clinical_data_platform/synthea_quality.py
          git commit -m "Split long quality-report Markdown strings"
          git push origin HEAD:feat/attrition-missingness-reports
