name: Apply benchmark core guard

on:
  push:
    branches:
      - feat/documented-loading-benchmark
    paths:
      - .github/workflows/apply-benchmark-core-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/documented-loading-benchmark
          fetch-depth: 0

      - name: Patch benchmark core invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/clinical_data_platform/benchmark.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "from clinical_data_platform.bulk import CopyMergePlan, copy_merge_rows\n",
              "from clinical_data_platform.bulk import CopyMergePlan, copy_merge_rows\n"
              "from clinical_data_platform.benchmark_safety import (\n"
              "    assert_isolated_empty_benchmark_database,\n"
              ")\n",
              1,
          )
          text = text.replace("    repetitions: int = 5\n", "    repetitions: int = 6\n", 1)
          text = text.replace(
              "        if self.repetitions <= 0:\n"
              "            raise ValueError(\"Benchmark repetitions must be positive.\")\n",
              "        if self.repetitions <= 0 or self.repetitions % 2 != 0:\n"
              "            raise ValueError(\n"
              "                \"Benchmark repetitions must be a positive even integer so method \"\n"
              "                \"starting positions are balanced.\"\n"
              "            )\n",
              1,
          )
          text = text.replace(
              "    \"\"\"Run, verify and export a reproducible COPY versus executemany benchmark.\"\"\"\n"
              "    effective = configuration or BenchmarkConfiguration()\n",
              "    \"\"\"Run, verify and export a reproducible COPY versus executemany benchmark.\"\"\"\n"
              "    assert_isolated_empty_benchmark_database(connection)\n"
              "    effective = configuration or BenchmarkConfiguration()\n",
              1,
          )

          required = (
              "from clinical_data_platform.benchmark_safety import (",
              "repetitions: int = 6",
              "self.repetitions % 2 != 0",
              "assert_isolated_empty_benchmark_database(connection)",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"Patch verification failed; missing markers: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit benchmark core guard
        run: |
          if git diff --quiet -- src/clinical_data_platform/benchmark.py; then
            echo "Benchmark core was already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clinical_data_platform/benchmark.py
          git commit -m "Enforce benchmark core safety and balanced ordering"
          git push origin HEAD:feat/documented-loading-benchmark
