name: Apply benchmark import fix

on:
  push:
    branches:
      - feat/documented-loading-benchmark
    paths:
      - .github/workflows/apply-benchmark-ruff-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/documented-loading-benchmark
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Ruff import ordering
        run: |
          python -m pip install ruff
          python -m ruff check --fix src/clinical_data_platform/benchmark.py

      - name: Commit import fix
        run: |
          if git diff --quiet -- src/clinical_data_platform/benchmark.py; then
            echo "No import changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/clinical_data_platform/benchmark.py
          git commit -m "Sort benchmark core imports"
          git push origin HEAD:feat/documented-loading-benchmark
