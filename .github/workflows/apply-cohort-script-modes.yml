name: Apply cohort script modes

on:
  push:
    branches:
      - feat/second-reproducible-cohort
    paths:
      - .github/workflows/apply-cohort-script-modes.yml

permissions:
  contents: write

jobs:
  chmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-reproducible-cohort
          fetch-depth: 0

      - name: Mark POSIX cohort runners executable
        run: |
          chmod +x scripts/generate_synthea_cohorts.sh
          chmod +x scripts/load_synthea_cohorts.sh

      - name: Commit file modes
        run: |
          if git diff --quiet -- scripts/generate_synthea_cohorts.sh scripts/load_synthea_cohorts.sh; then
            echo "Cohort runner modes are already executable."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_synthea_cohorts.sh scripts/load_synthea_cohorts.sh
          git commit -m "Mark POSIX cohort runners executable"
          git push origin HEAD:feat/second-reproducible-cohort
