name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    name: Python dependency audit, PR gate, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev,security,release]"
          python -m pip check

      - name: Audit installed Python dependencies
        run: |
          mkdir -p security-reports
          audit_status=0
          sbom_status=0
          python -m pip_audit \
            --local \
            --progress-spinner off \
            --format json \
            --output security-reports/pip-audit.json \
            || audit_status=$?
          python -m pip_audit \
            --local \
            --progress-spinner off \
            --format cyclonedx-json \
            --output security-reports/python-sbom.cdx.json \
            || sbom_status=$?
          if [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi
          exit "$sbom_status"

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-security-evidence
          path: security-reports
          if-no-files-found: warn
          retention-days: 30

  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[security]"

      - name: Scan Python source against reviewed baseline
        run: |
          mkdir -p security-reports
          python -m bandit -r src -ll -ii \
            -b security/bandit-baseline.json \
            -f json -o security-reports/bandit.json
          python -m bandit -r src -ll -ii \
            -b security/bandit-baseline.json

      - name: Upload static-analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-security-evidence
          path: security-reports
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: CodeQL Python analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python source
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:python

  container-vulnerabilities:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Build container image
        run: docker build --tag clinical-data-platform:security .

      - name: Scan image for known high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clinical-data-platform:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
