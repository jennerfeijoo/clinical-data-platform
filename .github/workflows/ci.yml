name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Reference quality (Python 3.11)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://clinical_user:clinical_password@localhost:5432/clinical_data
      CLINICAL_DATA_LOG_LEVEL: INFO
      CLINICAL_DATA_LOG_FORMAT: json

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinical_data
          POSTGRES_USER: clinical_user
          POSTGRES_PASSWORD: clinical_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_user -d clinical_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Exercise structured logging
        run: |
          LOG_FILE="$RUNNER_TEMP/clinical-data.jsonl"
          clinical-data validate-contracts > "$RUNNER_TEMP/contracts.txt" 2> "$LOG_FILE"
          python -c "import json, pathlib, sys; docs=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line]; assert docs; assert all(d['schema_version']=='1.0.0' for d in docs); assert docs[0]['event']=='cli.command.started'; assert docs[-1]['event']=='cli.command.completed'; assert len({d['correlation_id'] for d in docs})==1" "$LOG_FILE"

      - name: Exercise reproducible Synthea adapter
        run: |
          NORMALIZED="$RUNNER_TEMP/synthea-normalized"
          clinical-data synthea-profile > "$RUNNER_TEMP/synthea-profile.json"
          clinical-data synthea-adapt tests/fixtures/synthea/csv --output-dir "$NORMALIZED"
          clinical-data synthea-verify "$NORMALIZED"
          python -c "import json, pathlib, sys; d=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert d['upstream']['ref']=='v4.0.0'; assert d['generation']['random_seed']==20260729; assert d['generation']['thread_pool_size']==1" "$RUNNER_TEMP/synthea-profile.json"

      - name: Exercise independent cohort quality evidence
        run: |
          COHORT_A="$RUNNER_TEMP/cohort-a"
          COHORT_B="$RUNNER_TEMP/cohort-b"
          COMPARISON="$RUNNER_TEMP/cohort-comparison"
          QUALITY="$RUNNER_TEMP/cohort-quality"
          clinical-data-cohort list-profiles
          clinical-data-cohort adapt synthea-us-small-v1 \
            tests/fixtures/synthea/csv --output-dir "$COHORT_A"
          clinical-data-cohort adapt synthea-us-small-cohort-b-v1 \
            tests/fixtures/synthea/cohort_b/csv --output-dir "$COHORT_B"
          clinical-data-cohort compare "$COHORT_A" "$COHORT_B" \
            --output-dir "$COMPARISON"
          clinical-data-cohort quality-report "$COHORT_A" "$COHORT_B" \
            --output-dir "$QUALITY"
          python -c "import json, pathlib, sys; d=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert d['comparison_fingerprint']; assert all(value==0 for value in d['identifier_overlap_counts'].values()); assert len(d['cohorts'])==2" "$COMPARISON/synthea-cohort-comparison.json"
          python -c "import csv, json, pathlib, sys; root=pathlib.Path(sys.argv[1]); d=json.loads((root/'synthea-quality-report.json').read_text()); assert d['quality_fingerprint']; assert d['schema_version']=='1.0.0'; rows=list(csv.DictReader((root/'attrition.csv').open())); obs=[r for r in rows if r['cohort']=='cohort_a' and r['dataset']=='observations']; assert obs[0]['source_rows']=='4'; assert obs[0]['adapted_rows']=='3'; assert obs[0]['omitted_rows']=='1'; missing=list(csv.DictReader((root/'adapted-missingness.csv').open())); assert not [r for r in missing if r['required']=='True' and r['missing_count']!='0']" "$QUALITY"

      - name: Validate packaged contracts
        run: clinical-data validate-contracts

      - name: Validate packaged migrations
        run: |
          python -c "from clinical_data_platform.migration import discover_migrations; print([m.resource_path for m in discover_migrations()])"

      - name: Exercise migration CLI
        run: |
          clinical-data database-migrate
          clinical-data database-validate

      - name: Exercise immutable raw CLI
        run: |
          RAW_ROOT="$RUNNER_TEMP/raw"
          clinical-data raw-capture patients data/sample/patients.csv --raw-root "$RAW_ROOT"
          MANIFEST=$(find "$RAW_ROOT/receipts/patients" -type f -name '*.json' -print -quit)
          RELATIVE_MANIFEST=${MANIFEST#"$RAW_ROOT"/}
          clinical-data raw-verify "$RELATIVE_MANIFEST" --raw-root "$RAW_ROOT"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Test with mandatory coverage
        run: python -m pytest

      - name: Validate Compose hardening configuration
        run: docker compose --profile demo config --quiet

      - name: Build container image
        run: docker build --tag clinical-data-platform:ci .

      - name: Verify hardened container identity and filesystem
        run: |
          CONFIGURED_USER=$(docker image inspect --format '{{.Config.User}}' clinical-data-platform:ci)
          test "$CONFIGURED_USER" = "10001:10001"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --entrypoint sh \
            clinical-data-platform:ci \
            -ec 'test "$(id -u)" = "10001"; test "$(id -g)" = "10001"; test "$HOME" = "/home/clinical"; test "$XDG_CACHE_HOME" = "/tmp/.cache"; test "$XDG_CONFIG_HOME" = "/tmp/.config"; test "$(awk -F: '\''$3 == 10001 {print $7}'\'' /etc/passwd)" = "/usr/sbin/nologin"; test ! -w /app; test ! -w /opt/venv; test -w /tmp; touch /tmp/runtime-probe'

      - name: Smoke-test container contracts
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          clinical-data-platform:ci validate-contracts

      - name: Smoke-test container Synthea profile
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          clinical-data-platform:ci synthea-profile

      - name: Smoke-test container cohort profiles
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          --entrypoint clinical-data-cohort
          clinical-data-platform:ci list-profiles

      - name: Smoke-test container quality-report command
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          --entrypoint clinical-data-cohort
          clinical-data-platform:ci quality-report --help

      - name: Smoke-test packaged container migrations
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          --entrypoint python clinical-data-platform:ci
          -c "from clinical_data_platform.migration import discover_migrations; print(len(discover_migrations()))"

      - name: Validate PostgreSQL from hardened container
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          --network host --env DATABASE_URL="$DATABASE_URL"
          clinical-data-platform:ci database-validate

      - name: Smoke-test container raw capture as UID 10001
        run: |
          RAW_BIND="$RUNNER_TEMP/container-raw"
          mkdir -p "$RAW_BIND"
          chmod 0777 "$RAW_BIND"
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --volume "$RAW_BIND:/app/data/raw" \
            --entrypoint python \
            clinical-data-platform:ci \
            -c "from pathlib import Path; from clinical_data_platform.raw import capture_raw_source, verify_raw_receipt; receipt = capture_raw_source('patients', Path('/app/data/sample/patients.csv'), Path('/app/data/raw')); verify_raw_receipt(Path('/app/data/raw'), receipt.manifest_relative_path); print(receipt.sha256)"
          RECEIPT=$(find "$RAW_BIND" -type f -name '*.json' -print -quit)
          test -n "$RECEIPT"
          test "$(stat -c '%u' "$RECEIPT")" = "10001"

  python-compatibility:
    name: Compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      DATABASE_URL: postgresql://clinical_user:clinical_password@localhost:5432/clinical_data
      CLINICAL_DATA_LOG_LEVEL: INFO
      CLINICAL_DATA_LOG_FORMAT: json

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinical_data
          POSTGRES_USER: clinical_user
          POSTGRES_PASSWORD: clinical_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_user -d clinical_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Verify runtime and package metadata
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -c "import importlib.metadata, os, platform; expected=os.environ['EXPECTED_PYTHON']; assert platform.python_version().startswith(expected + '.'); assert importlib.metadata.version('clinical-data-platform') == '0.20.0'; print(platform.python_version())"

      - name: Validate contracts and cohort profiles
        run: |
          clinical-data validate-contracts
          clinical-data-cohort list-profiles

      - name: Validate PostgreSQL migrations
        run: |
          clinical-data database-migrate
          clinical-data database-validate

      - name: Run full suite with mandatory coverage
        run: python -m pytest
