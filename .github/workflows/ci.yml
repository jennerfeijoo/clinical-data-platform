name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://clinical_user:clinical_password@localhost:5432/clinical_data

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinical_data
          POSTGRES_USER: clinical_user
          POSTGRES_PASSWORD: clinical_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical_user -d clinical_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate packaged contracts
        run: clinical-data validate-contracts

      - name: Validate packaged migrations
        run: |
          python -c "from clinical_data_platform.migration import discover_migrations; print([m.resource_path for m in discover_migrations()])"

      - name: Exercise migration CLI
        run: |
          clinical-data database-migrate
          clinical-data database-validate

      - name: Exercise immutable raw CLI
        run: |
          RAW_ROOT="$RUNNER_TEMP/raw"
          clinical-data raw-capture patients data/sample/patients.csv --raw-root "$RAW_ROOT"
          MANIFEST=$(find "$RAW_ROOT/receipts/patients" -type f -name '*.json' -print -quit)
          RELATIVE_MANIFEST=${MANIFEST#"$RAW_ROOT"/}
          clinical-data raw-verify "$RELATIVE_MANIFEST" --raw-root "$RAW_ROOT"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest --cov=clinical_data_platform --cov-report=term-missing

      - name: Build container image
        run: docker build --tag clinical-data-platform:ci .

      - name: Smoke-test container contracts
        run: docker run --rm clinical-data-platform:ci validate-contracts

      - name: Smoke-test packaged container migrations
        run: >-
          docker run --rm --entrypoint python clinical-data-platform:ci
          -c "from clinical_data_platform.migration import discover_migrations; print(len(discover_migrations()))"

      - name: Smoke-test container raw capture
        run: |
          mkdir -p "$RUNNER_TEMP/container-raw"
          docker run --rm \
            --volume "$RUNNER_TEMP/container-raw:/tmp/raw" \
            --entrypoint python \
            clinical-data-platform:ci \
            -c "from pathlib import Path; from clinical_data_platform.raw import capture_raw_source, verify_raw_receipt; receipt = capture_raw_source('patients', Path('/app/data/sample/patients.csv'), Path('/tmp/raw')); verify_raw_receipt(Path('/tmp/raw'), receipt.manifest_relative_path); print(receipt.sha256)"
