[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-platform"
version = "0.3.0"
description = "A registry-driven clinical data engineering platform using synthetic healthcare data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jenner Feijoo" }
]
keywords = ["clinical-data", "data-engineering", "healthcare", "postgresql", "cohort"]
dependencies = [
    "psycopg[binary]>=3.2,<4"
]

[project.urls]
Repository = "https://github.com/jennerfeijoo/clinical-data-platform"

[project.scripts]
clinical-data = "clinical_data_platform.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running PostgreSQL instance"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clinical_data_platform"]
