[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-data-platform"
version = "0.16.0"
description = "An auditable synthetic clinical data platform with reproducible cohort quality reports, governed PostgreSQL loading, terminology normalization, and immutable lineage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jenner Feijoo" }
]
keywords = ["clinical-data", "data-engineering", "healthcare", "postgresql", "synthea"]
dependencies = [
    "psycopg[binary]>=3.2,<4"
]

[project.urls]
Repository = "https://github.com/jennerfeijoo/clinical-data-platform"

[project.scripts]
clinical-data = "clinical_data_platform.entrypoint:main"
clinical-data-benchmark = "clinical_data_platform.benchmark_cli:main"
clinical-data-cohort = "clinical_data_platform.cohort_cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clinical_data_platform.contracts" = ["manifest.toml", "*/v*.toml"]
"clinical_data_platform.migrations" = ["V*.sql"]
"clinical_data_platform.synthea_profiles" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running PostgreSQL instance"
]

[tool.ruff]
line-length = 101
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clinical_data_platform"]
