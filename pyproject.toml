[build-system]
requires = ["setuptools>=83"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "clinical-data-platform"
version = "1.0.0"
description = "An auditable synthetic clinical data platform with governed releases, a hardened non-root container, security scanning, multi-version Python CI, reproducible cohort quality evidence, PostgreSQL loading, terminology normalization, and immutable lineage."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "Jenner Feijoo" }
]
keywords = ["clinical-data", "data-engineering", "healthcare", "postgresql", "synthea"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "psycopg[binary]>=3.2,<4"
]

[project.urls]
Repository = "https://github.com/jennerfeijoo/clinical-data-platform"
Documentation = "https://github.com/jennerfeijoo/clinical-data-platform/tree/main/docs"
Changelog = "https://github.com/jennerfeijoo/clinical-data-platform/blob/main/CHANGELOG.md"
Issues = "https://github.com/jennerfeijoo/clinical-data-platform/issues"
Security = "https://github.com/jennerfeijoo/clinical-data-platform/security/policy"

[project.scripts]
clinical-data = "clinical_data_platform.entrypoint:main"
clinical-data-benchmark = "clinical_data_platform.benchmark_cli:main"
clinical-data-cohort = "clinical_data_platform.cohort_cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
security = [
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.10,<3",
]
release = [
    "build>=1.2,<2",
    "twine>=6,<8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clinical_data_platform" = ["py.typed"]
"clinical_data_platform.contracts" = ["manifest.toml", "*/v*.toml"]
"clinical_data_platform.cohort_definitions" = ["*.sql"]
"clinical_data_platform.migrations" = ["V*.sql"]
"clinical_data_platform.synthea_profiles" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=clinical_data_platform --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: tests that require a running PostgreSQL instance"
]

[tool.coverage.run]
source = ["clinical_data_platform"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 101
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clinical_data_platform"]
